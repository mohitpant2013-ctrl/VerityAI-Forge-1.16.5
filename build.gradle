buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.77' }
}
apply plugin: 'net.minecraftforge.gradle'
version = '0.2.0'
group = 'dev.fyredeft.verityai'
archivesBaseName = 'VerityAI'
sourceCompatibility = targetCompatibility = '1.8'
compileJava { sourceCompatibility = targetCompatibility = '1.8' }
minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { verityai { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { verityai { source sourceSets.main } } }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.42' }
jar { manifest { attributes(['Specification-Title':'verityai','Specification-Vendor':'FYreDeft','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version]) } }

// Decode the hand-authored pixel-art atlas into the PNG resource expected by Minecraft.
// Keeping the source atlas as base64 text allows the resource to be versioned safely
// through text-only repository APIs while the built JAR contains a normal PNG.
def verityAtlasSource = file('src/main/resources/assets/verityai/textures/entity/verity.png.b64')
def verityAtlasOutput = file("$buildDir/generated/verityResources/assets/verityai/textures/entity/verity.png")

def stalkerAtlasSource = file('src/main/resources/assets/verityai/textures/entity/stalker.png.b64')
def stalkerAtlasOutput = file("$buildDir/generated/verityResources/assets/verityai/textures/entity/stalker.png")

task generateVerityAtlas {
    inputs.file verityAtlasSource
    outputs.file verityAtlasOutput
    doLast {
        verityAtlasOutput.parentFile.mkdirs()
        verityAtlasOutput.bytes = verityAtlasSource.text.trim().decodeBase64()
    }
}

task generateStalkerAtlas {
    inputs.file stalkerAtlasSource
    outputs.file stalkerAtlasOutput
    doLast {
        stalkerAtlasOutput.parentFile.mkdirs()
        stalkerAtlasOutput.bytes = stalkerAtlasSource.text.trim().decodeBase64()
    }
}

sourceSets.main.resources.srcDir("$buildDir/generated/verityResources")
processResources.dependsOn generateVerityAtlas, generateStalkerAtlas
