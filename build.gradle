buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.16' }
}
apply plugin: 'net.minecraftforge.gradle'
version = '0.1.0'
group = 'dev.fyredeft.verityai'
archivesBaseName = 'VerityAI'
sourceCompatibility = targetCompatibility = '1.8'
compileJava { sourceCompatibility = targetCompatibility = '1.8' }
minecraft {
    mappings channel: 'stable', version: '39-1.16.5'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { verityai { source sourceSets.main } } }
        server { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { verityai { source sourceSets.main } } }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.42' }
jar { manifest { attributes(['Specification-Title':'verityai','Specification-Vendor':'FYreDeft','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.version]) } }
