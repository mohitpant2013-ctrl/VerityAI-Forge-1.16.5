name: Build Forge mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.9.4'
      - name: Build
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: VerityAI-Forge-1.16.5
          path: build/libs/*.jar
